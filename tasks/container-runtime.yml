---

- name: Add Docker CE Package signing key
  ansible.builtin.shell:
    cmd:  curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor --batch --yes -o /etc/apt/keyrings/docker.gpg

- name: Add Docker CE APT repo
  ansible.builtin.apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Remove Distribution's docker package
  ansible.builtin.apt:
    name:
      - docker.io
    state: absent

- name: Install docker packages 
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: latest
    update_cache: yes

- name: Enable service Docker
  ansible.builtin.service:
    name: docker
    enabled: yes
    state: started

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: yes
  with_items:  "{{ add_docker_users }} "

- name: Remove users from docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: yes
  with_items:  "{{ remove_docker_users }} "

- name: Deploy config.toml
  ansible.builtin.template:
    src: docker/config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
  notify: Restart containerd

- name: Deploy /etc/docker/daemon.json
  ansible.builtin.template:
    src: docker/daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart containerd
